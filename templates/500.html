<!doctype html>
{% comment %}
  サーバーの中でエラーが起きたときの画面（Issue #45）。本番（DEBUG=False）のときに Django が使う。
  エラーの原因がデータベースやひな形（base.html）にあっても出せるように、ほかの部品を使わず、この1枚だけで書く。
  エラーの中身は見せない（中身はサーバーの記録（ログ）で見る）。
{% endcomment %}
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>エラー</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f2f2f2; color: #222; font-family: sans-serif; }
    main { max-width: 22rem; margin: 1rem; padding: 2rem 1.5rem; border-radius: 1rem; background: #fff; text-align: center; }
    a { display: inline-block; margin-top: 1rem; padding: 0.75rem 1.25rem; border-radius: 0.5rem; background: #4a3aff; color: #fff; text-decoration: none; }
    @media (prefers-color-scheme: dark) { body { background: #1d232a; color: #eee; } main { background: #2a323c; } }
  </style>
</head>
<body>
  <main>
    <p style="font-size: 2.5rem; margin: 0" aria-hidden="true">⚠️</p>
    <h1 style="font-size: 1.25rem">うまく動きませんでした</h1>
    <p style="font-size: 0.875rem; opacity: 0.7">少し待ってから，もう一度ためしてください</p>
    <a href="/">🏠 ホームへ</a>
  </main>
</body>
</html>
