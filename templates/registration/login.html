{% extends "base.html" %}

{% block title %}ログイン{% endblock %}

{% block content %}
  <h1>ログイン</h1>

  {% if form.errors %}
    <p class="errorlist">ユーザー名かパスワードが違います．</p>
  {% endif %}

  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <!-- ログインが必要な画面から来たときは，ログイン後にその画面へ戻す -->
    <input type="hidden" name="next" value="{{ next }}">
    <button type="submit">ログイン</button>
  </form>

  <p>はじめての方は <a href="{% url 'signup' %}">ユーザー登録</a></p>
{% endblock %}
