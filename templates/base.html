<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <!-- スマホの画面幅に合わせて表示する -->
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}タスク管理{% endblock %}</title>
  <!--
    見た目のライブラリ（CDNから読み込む）
    - daisyUI：ボタン・カード・入力欄などの部品
    - Tailwind CSS：class に書くだけで余白や大きさを整える道具
    公開するときは、CDNではなく自分のサーバーから配る方法に切り替える
  -->
  <link href="https://cdn.jsdelivr.net/npm/daisyui@5.7.50/daisyui.css" rel="stylesheet" type="text/css">
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.4"></script>
</head>
<body class="min-h-screen bg-base-200">
  <!-- 上のバー：アプリ名とログアウト -->
  <header class="navbar sticky top-0 z-10 bg-base-100 shadow-sm">
    <div class="mx-auto flex w-full max-w-md items-center justify-between gap-2 px-2">
      <a href="{% url 'home' %}" class="shrink-0 text-lg font-bold">タスク管理</a>
      {% if user.is_authenticated %}
        <!-- ログアウトは安全のためPOSTで送る（Django 5からの決まり） -->
        <form method="post" action="{% url 'logout' %}" class="flex min-w-0 items-center gap-1">
          {% csrf_token %}
          <!-- 名前が長いときは「…」で省略して、画面からはみ出さないようにする -->
          <span class="truncate text-sm">{{ user.username }} さん</span>
          <button type="submit" class="btn btn-ghost btn-sm shrink-0">ログアウト</button>
        </form>
      {% endif %}
    </div>
  </header>

  <!-- 画面ごとの中身。ログイン中は下のメニューに隠れないよう下に余白をとる -->
  <main class="mx-auto w-full max-w-md px-4 py-6 {% if user.is_authenticated %}pb-24{% endif %}">
    <!-- お知らせ（「登録しました」など）。ビューで messages に入れたものが、次の画面で一度だけ出る -->
    {% for message in messages %}
      <div role="alert" class="alert {% if message.tags == 'success' %}alert-success{% elif message.tags == 'error' %}alert-error{% else %}alert-info{% endif %} mb-4 text-sm">
        {{ message }}
      </div>
    {% endfor %}
    {% block content %}{% endblock %}
  </main>

  {% if user.is_authenticated %}
    <!-- 下のメニュー：片手で親指が届く位置に置く。まだない画面は「準備中」 -->
    <nav class="dock dock-md bg-base-100">
      <a href="{% url 'home' %}" class="{% if request.resolver_match.url_name == 'home' %}dock-active{% endif %}">
        <span class="text-xl" aria-hidden="true">🏠</span>
        <span class="dock-label">ホーム</span>
      </a>
      <a href="{% url 'task_create' %}" class="{% if request.resolver_match.url_name == 'task_create' %}dock-active{% endif %}">
        <span class="text-xl" aria-hidden="true">➕</span>
        <span class="dock-label">追加</span>
      </a>
      <button type="button" class="text-base-content/50" disabled title="準備中">
        <span class="text-xl" aria-hidden="true">📊</span>
        <span class="dock-label">進み具合</span>
      </button>
    </nav>
  {% endif %}
</body>
</html>
