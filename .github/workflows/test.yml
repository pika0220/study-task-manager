# GitHub Actions の手順書：Pull Request と main への push のたびに自動でテストする
name: test

on:
  pull_request: # Pull Request を作ったとき・PRのブランチに push したとき
  push:
    branches: [main] # main に入ったとき（マージしたとき）

jobs:
  test:
    name: test # Ruleset の「必須のチェック」にはこの名前で出てくる
    runs-on: ubuntu-latest # GitHub が用意する Linux のパソコンで動かす
    steps:
      - name: コードを取り出す
        uses: actions/checkout@v4

      - name: uv を入れる
        uses: astral-sh/setup-uv@v6

      - name: Python と Django などを入れる（uv.lock のとおり）
        run: uv sync --locked

      - name: 設定に問題がないか確かめる
        run: uv run python manage.py check

      # 本番（DJANGO_DEBUG=0）の設定で、Django の公開前の点検をする（Issue #45）。
      # 鍵は、毎回その場で作るランダムな文字列（本物の鍵は GitHub に置かない）。
      # --fail-level WARNING：警告が1つでもあれば失敗にする
      - name: 本番の設定を点検する（check --deploy）
        env:
          DJANGO_DEBUG: "0"
          DJANGO_ALLOWED_HOSTS: example.com
        run: |
          export DJANGO_SECRET_KEY="$(uv run python -c 'import secrets; print(secrets.token_urlsafe(50))')"
          export DJANGO_FIELD_KEY="$(uv run python -c 'from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())')"
          uv run python manage.py check --deploy --fail-level WARNING

      - name: マイグレーションの作り忘れがないか確かめる
        run: uv run python manage.py makemigrations --check --dry-run

      - name: テストを実行する
        run: uv run python manage.py test
